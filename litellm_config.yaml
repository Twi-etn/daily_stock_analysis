      model: nvidia_nim/minimaxai/minimax-m2.5
      api_base: https://integrate.api.nvidia.com/v1
      api_key: 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
      
